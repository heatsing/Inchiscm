[build]
  command = "npm run verify"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; upgrade-insecure-requests"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonical host: force https://www and http apex to https://inchiscm.com in one hop.
# Netlify always upgrades HTTP→HTTPS on the same host first (HSTS preload). That means
# http://www.inchiscm.com → https://www.inchiscm.com cannot be skipped, then the
# https://www rule below sends traffic to the apex. force=true skips a second www hop
# after HTTPS. The http://www rule is kept as intent; Netlify may not execute it.
[[redirects]]
  from = "http://www.inchiscm.com/*"
  to = "https://inchiscm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.inchiscm.com/*"
  to = "https://inchiscm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://inchiscm.com/*"
  to = "https://inchiscm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/1-inches-in-cm"
  to = "/1-inch-in-cm"
  status = 301

[[redirects]]
  from = "/1-inch-to-cm"
  to = "/1-inch-in-cm"
  status = 301

[[redirects]]
  from = "/inches-to-centimeters"
  to = "/inches-to-cm"
  status = 301

[[redirects]]
  from = "/centimeters-to-inches"
  to = "/cm-to-inches"
  status = 301

# Owner-authorized synonym consolidations: formula-grid singular unit names
# that duplicate dedicated converters. One hop, no numeric inventory.
[[redirects]]
  from = "/inch-to-millimeter"
  to = "/inches-to-mm"
  status = 301

[[redirects]]
  from = "/millimeter-to-inch"
  to = "/mm-to-inches"
  status = 301

[[redirects]]
  from = "/inch-to-foot"
  to = "/inches-to-feet"
  status = 301

[[redirects]]
  from = "/foot-to-inch"
  to = "/feet-to-inches"
  status = 301

[[redirects]]
  from = "/meter-to-foot"
  to = "/meters-to-feet"
  status = 301

[[redirects]]
  from = "/foot-to-meter"
  to = "/feet-to-meters"
  status = 301

[[redirects]]
  from = "/yard-to-meter"
  to = "/yards-to-meters"
  status = 301

[[redirects]]
  from = "/meter-to-yard"
  to = "/meters-to-yards"
  status = 301

[[redirects]]
  from = "/kilometer-to-mile"
  to = "/km-to-miles"
  status = 301

[[redirects]]
  from = "/meter-to-centimeter"
  to = "/meters-to-cm"
  status = 301

[[redirects]]
  from = "/centimeter-to-meter"
  to = "/cm-to-meters"
  status = 301

[[redirects]]
  from = "/millimeter-to-centimeter"
  to = "/mm-to-cm"
  status = 301

[[redirects]]
  from = "/centimeter-to-millimeter"
  to = "/cm-to-mm"
  status = 301

# Interior URLs prefer no trailing slash, matching canonicals and Next trailingSlash=false.
# A single catch-all keeps slash policy consistent without per-URL alias explosion.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
