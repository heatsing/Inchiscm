[build]
  command = "npm run verify"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; upgrade-insecure-requests"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonical host: one hop from http/https www (and http apex) to https://inchiscm.com.
# force=true skips Netlify's default same-host HTTP→HTTPS hop so www does not bounce
# http://www → https://www → https://apex.
[[redirects]]
  from = "http://www.inchiscm.com/*"
  to = "https://inchiscm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.inchiscm.com/*"
  to = "https://inchiscm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://inchiscm.com/*"
  to = "https://inchiscm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/1-inches-in-cm"
  to = "/1-inch-in-cm"
  status = 301

[[redirects]]
  from = "/1-inch-to-cm"
  to = "/1-inch-in-cm"
  status = 301

[[redirects]]
  from = "/inches-to-centimeters"
  to = "/inches-to-cm"
  status = 301

[[redirects]]
  from = "/centimeters-to-inches"
  to = "/cm-to-inches"
  status = 301

# Interior URLs prefer no trailing slash, matching canonicals and Next trailingSlash=false.
# A single catch-all keeps slash policy consistent without per-URL alias explosion.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
