[build]
  command = "npm run verify"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/1-inches-in-cm"
  to = "/1-inch-in-cm"
  status = 301

[[redirects]]
  from = "/1-inch-to-cm"
  to = "/1-inch-in-cm"
  status = 301

[[redirects]]
  from = "/inches-to-centimeters"
  to = "/inches-to-cm"
  status = 301

[[redirects]]
  from = "/centimeters-to-inches"
  to = "/cm-to-inches"
  status = 301
